server:
  port: 8088
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: pad-stamping-management
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
      file-size-threshold: 2MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  mvc:
    format:
      # GET 查询参数中 LocalDateTime 的绑定格式，与前端日期选择器 value-format 一致；
      # 不配置时 Spring 默认仅支持 ISO(yyyy-MM-ddTHH:mm:ss)，台账日期区间筛选会绑定失败
      date-time: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.stamping.pad.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    cache-enabled: false
    lazy-loading-enabled: false
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      table-underline: true

file:
  upload:
    path: ${user.dir}/uploads
    url-prefix: /files
    max-size: 52428800
    allowed-types: image/jpeg,image/png,image/gif,image/jpg,image/webp

logging:
  level:
    root: INFO
    com.stamping.pad: DEBUG
    org.springframework.web: INFO
    com.baomidou.mybatisplus: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: logs/pad-management.log
    max-size: 50MB
    max-history: 30
